<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NoteMaster'a Yönlendiriliyorsunuz...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0D14;
      --card-bg: rgba(19, 24, 38, 0.9);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --primary: #6366F1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .container { width: 100%; max-width: 420px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }
    .color-stripe { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: #6366F1; }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366F1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: #FFF; }
    p { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
    .actions { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: linear-gradient(135deg, #6366F1, #4F46E5); color: #FFF; }
    .btn-secondary { background: rgba(255,255,255,0.06); color: #FFF; border: 1px solid rgba(255,255,255,0.12); }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="card">
      <div class="color-stripe"></div>
      <div class="spinner"></div>
      <h1>NoteMaster Açılıyor</h1>
      <p id="statusText">Uygulama başlatılıyor, lütfen bekleyin...</p>
      <div class="actions" id="actionBtns" style="display: none;"></div>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('t');
    const endpoint = `https://mwqlisyiczrqhuiacdfj.supabase.co/functions/v1/share?t=${token}&format=json`;

    fetch(endpoint)
      .then(res => res.json())
      .then(res => {
        if (!res.success || !res.item) {
          document.getElementById('app').innerHTML = `
            <div class="card">
              <h2 style="color:#EF4444; margin-bottom:8px; font-size:18px;">Bağlantı Geçersiz</h2>
              <p>Bu paylaşım bağlantısının geçerlilik süresi dolmuş veya kaldırılmış.</p>
              <a href="${res.playStoreUrl || '#'}" class="btn btn-primary">Uygulamayı İndir</a>
            </div>
          `;
          return;
        }

        const isIos = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        const isAndroid = /Android/i.test(navigator.userAgent);
        const playStoreUrl = res.playStoreUrl;
        const appStoreUrl = res.appStoreUrl;
        const deepLink = `notemaster://s/${token}`;

        const statusEl = document.getElementById('statusText');
        const actionsEl = document.getElementById('actionBtns');

        if (isAndroid) {
          // Android Chrome Resmi Intent Protokolü:
          // Uygulama varsa doğrudan açar, yoksa arka planda sessizce Play Store'a yönlendirir.
          const androidIntent = `intent://s/${token}#Intent;scheme=notemaster;package=com.notemaster.app;S.browser_fallback_url=${encodeURIComponent(playStoreUrl)};end;`;
          window.location.href = androidIntent;

          setTimeout(() => {
            statusEl.textContent = "Uygulama açılmadıysa mağazadan indirebilirsiniz:";
            actionsEl.style.display = "flex";
            actionsEl.innerHTML = `
              <a href="${androidIntent}" class="btn btn-primary">Tekrar Dene</a>
              <a href="${playStoreUrl}" class="btn btn-secondary">Google Play'den İndir</a>
            `;
          }, 2000);

        } else if (isIos) {
          // iOS Safari Yönlendirme & Fallback
          const startTime = Date.now();
          window.location.href = deepLink;

          setTimeout(() => {
            // Eğer kullanıcı NoteMaster'a geçiş yapmadıysa tarayıcıda kalmıştır -> App Store'a yönlendir
            if (!document.hidden && Date.now() - startTime < 3000) {
              window.location.href = appStoreUrl;
            }
          }, 1800);

          setTimeout(() => {
            statusEl.textContent = "Yönlendirme tamamlanmadıysa:";
            actionsEl.style.display = "flex";
            actionsEl.innerHTML = `
              <a href="${deepLink}" class="btn btn-primary">Uygulamada Aç</a>
              <a href="${appStoreUrl}" class="btn btn-secondary">App Store'dan İndir</a>
            `;
          }, 2500);

        } else {
          // Masaüstü Kullanıcıları
          statusEl.textContent = "Bu notu görüntülemek için NoteMaster mobil uygulamasını yükleyin:";
          actionsEl.style.display = "flex";
          actionsEl.innerHTML = `
            <a href="${appStoreUrl}" target="_blank" class="btn btn-primary">App Store (iOS)</a>
            <a href="${playStoreUrl}" target="_blank" class="btn btn-secondary">Google Play (Android)</a>
          `;
        }
      })
      .catch(() => {
        document.getElementById('statusText').textContent = "Sunucuya bağlanırken bir hata oluştu.";
      });
  </script>
</body>
</html>
