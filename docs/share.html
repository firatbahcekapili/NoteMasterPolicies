<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Paylaşılan Not • NoteMaster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0D14;
      --card-bg: rgba(19, 24, 38, 0.9);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --primary: #6366F1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.6;
    }
    .container { width: 100%; max-width: 420px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }
    .color-stripe { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: #6366F1; }
    .icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
    }
    .note-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: #FFF; word-break: break-word; }
    .notice { font-size: 13.5px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
    .actions { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 18px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: linear-gradient(135deg, #6366F1, #4F46E5); color: #FFF; box-shadow: 0 4px 18px rgba(99, 102, 241, 0.4); }
    .btn-store { background: #0F172A; color: #FFF; border: 1px solid rgba(255, 255, 255, 0.12); font-size: 14px; }
    .btn-apple { background: #000; }
    .store-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 400px) { .store-grid { grid-template-columns: 1fr; } }
    .footer { margin-top: 20px; font-size: 12px; color: #64748B; text-align: center; }
    .loader { text-align: center; padding: 40px; color: var(--text-muted); font-weight: 600; }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="loader">Yükleniyor...</div>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('t');
    const endpoint = `https://mwqlisyiczrqhuiacdfj.supabase.co/functions/v1/share?t=${token}&format=json`;

    fetch(endpoint)
      .then(res => res.json())
      .then(res => {
        if (!res.success || !res.item) {
          document.getElementById('app').innerHTML = `
            <div class="card">
              <div class="icon-wrap" style="background:rgba(239,68,68,0.15); border-color:rgba(239,68,68,0.3);">⚠️</div>
              <h2 style="color:#EF4444; margin-bottom:8px; font-size:18px;">Bağlantı Geçersiz</h2>
              <p class="notice">Bu paylaşım bağlantısının geçerlilik süresi dolmuş veya kaldırılmış.</p>
              <a href="${res.playStoreUrl || '#'}" class="btn btn-primary">Uygulamayı İndir</a>
            </div>
          `;
          return;
        }

        const isIos = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        const isAndroid = /Android/i.test(navigator.userAgent);
        const deepLink = `notemaster://s/${token}`;
        const item = res.item;

        // 1. Doğrudan standart şema ile uygulamayı tetikle
        if (isIos || isAndroid) {
          window.location.href = deepLink;
          
          // Yedek iframe tetikleyicisi
          const iframe = document.createElement("iframe");
          iframe.style.display = "none";
          iframe.src = deepLink;
          document.body.appendChild(iframe);
          setTimeout(() => { if (iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 1000);
        }

        let storeHtml = '';
        if (isIos) {
          storeHtml = `<a href="${res.appStoreUrl}" target="_blank" rel="noopener" class="btn btn-store btn-apple">App Store'dan İndir</a>`;
        } else if (isAndroid) {
          storeHtml = `<a href="${res.playStoreUrl}" target="_blank" rel="noopener" class="btn btn-store">Google Play'den İndir</a>`;
        } else {
          storeHtml = `
            <div class="store-grid">
              <a href="${res.appStoreUrl}" target="_blank" rel="noopener" class="btn btn-store btn-apple">App Store</a>
              <a href="${res.playStoreUrl}" target="_blank" rel="noopener" class="btn btn-store">Google Play</a>
            </div>
          `;
        }

        document.getElementById('app').innerHTML = `
          <div class="card">
            <div class="color-stripe" style="background:${item.color || '#6366F1'}"></div>
            <div class="icon-wrap">🔒</div>
            <h1 class="note-title">${item.title || 'Paylaşılan Not'}</h1>
            <p class="notice">Bu notun içeriğini görüntülemek ve düzenlemek için NoteMaster uygulamasını açın.</p>
            
            <div class="actions">
              <a href="${deepLink}" class="btn btn-primary" id="openAppBtn">NoteMaster Uygulamasında Aç</a>
              ${storeHtml}
            </div>
          </div>
          <div class="footer">NoteMaster • Güvenli ve Akıllı Not Defteri</div>
        `;

        // Kullanıcı butona dokunduğunda doğrudan OS Intent'i devreye girer (Asla Play Store'a zorlamaz)
        document.getElementById('openAppBtn').addEventListener('click', (e) => {
          window.location.href = deepLink;
        });
      })
      .catch(() => {
        document.getElementById('app').innerHTML = `
          <div class="card">
            <div class="icon-wrap" style="background:rgba(239,68,68,0.15);">⚠️</div>
            <h2 style="color:#EF4444; font-size:18px;">Bağlantı Hatası</h2>
            <p class="notice">İçeriğe ulaşılamadı. Lütfen internet bağlantınızı kontrol edin.</p>
          </div>
        `;
      });
  </script>
</body>
</html>
