<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Paylaşılan Not • NoteMaster</title>
  <meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0A0B" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <style>
    /* Same palette as the landing page. */
    :root {
      --bg: #F6F5F2;
      --surface: #FFFFFF;
      --surface-2: #F3F1ED;
      --text: #111110;
      --text-soft: #55534E;
      --text-faint: #8A8781;
      --line: #E2DFD9;
      --line-strong: #D3CFC8;
      --primary: #111110;
      --primary-text: #F6F5F2;
      --danger: #C4321F;
      --shadow: 0 2px 6px rgba(28,25,23,.05), 0 30px 60px -20px rgba(28,25,23,.18);
      --serif: "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0A0A0B;
        --surface: #161618;
        --surface-2: #1E1E21;
        --text: #F5F4F2;
        --text-soft: #B3B1AB;
        --text-faint: #7F7D78;
        --line: #26262A;
        --line-strong: #333338;
        --primary: #F5F4F2;
        --primary-text: #0A0A0B;
        --danger: #F07A6E;
        --shadow: 0 2px 6px rgba(0,0,0,.3), 0 30px 60px -20px rgba(0,0,0,.7);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: -30% -10% auto; height: 70%; pointer-events: none; z-index: -1;
      background: radial-gradient(50% 50% at 50% 0%, color-mix(in srgb, var(--text) 6%, transparent), transparent 70%);
    }
    .container { width: 100%; max-width: 520px; animation: rise .8s var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
    .brand {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-weight: 600; font-size: 16px; letter-spacing: -0.01em; color: var(--text); text-decoration: none;
      margin-bottom: 22px;
    }
    .brand img { width: 30px; height: 30px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 34px 28px 28px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .stripe { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--text-faint); }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 14px;
    }
    .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); }
    h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.2; margin-bottom: 8px; word-wrap: break-word; }
    .meta { font-size: 14px; color: var(--text-soft); margin-bottom: 20px; }
    .meta span + span::before { content: " · "; color: var(--text-faint); }
    .content {
      font-size: 16px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 55vh;
      overflow-y: auto;
      padding: 18px 20px;
      background: var(--surface-2);
      border-radius: 18px;
    }
    .content:empty { display: none; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
    .actions:empty, #stores:empty { display: none; }
    .btn {
      display: flex; align-items: center; justify-content: center;
      min-height: 52px; padding: 12px 20px;
      border-radius: 26px;
      font-family: inherit; font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em;
      text-decoration: none; cursor: pointer; border: none;
      transition: transform .3s var(--ease), border-color .2s;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--primary); color: var(--primary-text); }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--line-strong); }
    .btn-outline:hover { border-color: var(--text-faint); }
    #stores { display: flex; flex-direction: column; gap: 10px; }
    .store-grid { display: grid !important; grid-template-columns: 1fr 1fr; gap: 10px; }
    .center { text-align: center; }
    .icon {
      width: 64px; height: 64px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 4px auto 18px;
      border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
      color: var(--danger);
    }
    .icon svg { width: 28px; height: 28px; }
    .notice { color: var(--text-soft); font-size: 15px; margin-top: 4px; }
    /* Loading: the shape of a note, gently shimmering. */
    .skeleton { display: grid; gap: 12px; padding: 4px 0 8px; }
    .skeleton i {
      display: block; height: 12px; border-radius: 6px;
      background: linear-gradient(90deg, var(--surface-2) 0%, var(--line) 50%, var(--surface-2) 100%);
      background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite;
    }
    .skeleton i:nth-child(1) { width: 30%; height: 10px; }
    .skeleton i:nth-child(2) { width: 75%; height: 22px; margin-bottom: 8px; }
    .skeleton i:nth-child(3) { width: 100%; }
    .skeleton i:nth-child(4) { width: 92%; }
    .skeleton i:nth-child(5) { width: 64%; }
    @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
    footer { margin-top: 22px; font-size: 13px; color: var(--text-faint); text-align: center; }
    [hidden] { display: none !important; }
    @media (max-width: 420px) {
      .card { padding: 30px 20px 22px; border-radius: 24px; }
      .store-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .container, .skeleton i { animation: none; }
    }
  </style>
</head>
<body>
  <main class="container">
    <a class="brand" href="index.html"><img src="assets/icon-128.png" alt="" width="30" height="30">NoteMaster</a>

    <div class="card" id="card">
      <div class="stripe" id="stripe"></div>

      <div id="loading"><div class="skeleton" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>

      <div id="error" class="center" hidden>
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/><path d="m3 3 18 18"/></svg></div>
        <h1 id="error-title" style="color: var(--danger);">Bağlantı Geçersiz</h1>
        <p class="notice" id="error-message">Bu paylaşım bağlantısı kaldırılmış veya süresi dolmuş.</p>
      </div>

      <div id="item" hidden>
        <div class="badge"><span class="dot" id="dot"></span><span id="type-label">Not</span></div>
        <h1 id="title"></h1>
        <div class="meta" id="meta"></div>
        <div class="content" id="content"></div>
      </div>

      <div class="actions">
        <a class="btn btn-primary" id="open-app" hidden>Uygulamada Aç</a>
        <div id="stores"></div>
      </div>
    </div>
    <footer>NoteMaster ile paylaşıldı</footer>
  </main>

  <script>
    (function () {
      // Public project URL; the data comes from the `share` edge function.
      var SHARE_ENDPOINT = 'https://mwqlisyiczrqhuiacdfj.supabase.co/functions/v1/share';
      var DEFAULT_PLAY = 'https://play.google.com/store/apps/details?id=com.fcodetr.notemaster';
      var DEFAULT_APPLE = '';

      var ua = navigator.userAgent || '';
      var isIos = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
      var isAndroid = /Android/i.test(ua);
      var isEn = (navigator.language || '').toLowerCase().indexOf('tr') !== 0;

      var TEXT = isEn ? {
        note: 'Note', task: 'Task', event: 'Event',
        openApp: 'Open in App', play: 'Get it on Google Play', apple: 'Download on the App Store',
        invalidTitle: 'Link Unavailable', invalidMsg: 'This shared link was removed or has expired.',
        missingMsg: 'The share link is incomplete.', networkMsg: 'Could not load the shared item. Please try again.',
        untitled: 'Untitled', footer: 'Shared with NoteMaster'
      } : {
        note: 'Not', task: 'Görev', event: 'Etkinlik',
        openApp: 'Uygulamada Aç', play: "Google Play'den İndir", apple: "App Store'dan İndir",
        invalidTitle: 'Bağlantı Geçersiz', invalidMsg: 'Bu paylaşım bağlantısı kaldırılmış veya süresi dolmuş.',
        missingMsg: 'Paylaşım bağlantısı eksik.', networkMsg: 'Paylaşılan içerik yüklenemedi. Lütfen tekrar deneyin.',
        untitled: 'Başlıksız', footer: 'NoteMaster ile paylaşıldı'
      };
      if (isEn) document.documentElement.lang = 'en';
      document.querySelector('footer').textContent = TEXT.footer;

      var $ = function (id) { return document.getElementById(id); };
      var show = function (id) { $(id).hidden = false; };
      var hide = function (id) { $(id).hidden = true; };

      // Only #rgb / #rrggbb colors from the data are used in styles.
      var safeColor = function (c) { return /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(c || '') ? c : '#6366F1'; };

      var formatDate = function (value, withTime) {
        if (!value) return '';
        var d = new Date(value);
        if (isNaN(d.getTime())) return '';
        var opts = { day: 'numeric', month: 'long', year: 'numeric' };
        if (withTime) { opts.hour = '2-digit'; opts.minute = '2-digit'; }
        return d.toLocaleString(isEn ? 'en-US' : 'tr-TR', opts);
      };

      var renderStores = function (playUrl, appleUrl) {
        var box = $('stores');
        box.textContent = '';
        var make = function (href, label) {
          var a = document.createElement('a');
          a.className = 'btn btn-outline';
          a.href = href; a.target = '_blank'; a.rel = 'noopener';
          a.textContent = label;
          return a;
        };
        var links = [];
        if (isIos) { if (appleUrl) links.push(make(appleUrl, TEXT.apple)); }
        else if (isAndroid) { if (playUrl) links.push(make(playUrl, TEXT.play)); }
        else {
          if (playUrl) links.push(make(playUrl, TEXT.play));
          if (appleUrl) links.push(make(appleUrl, TEXT.apple));
        }
        if (links.length > 1) box.className = 'store-grid';
        links.forEach(function (a) { box.appendChild(a); });
      };

      var showError = function (message) {
        hide('loading');
        $('error-title').textContent = TEXT.invalidTitle;
        $('error-message').textContent = message || TEXT.invalidMsg;
        $('stripe').style.background = 'var(--danger)';
        show('error');
        renderStores(DEFAULT_PLAY, DEFAULT_APPLE);
      };

      var token = new URLSearchParams(window.location.search).get('t');
      if (!token || !/^[A-Za-z0-9_-]{8,128}$/.test(token)) {
        showError(TEXT.missingMsg);
        return;
      }

      fetch(SHARE_ENDPOINT + '?t=' + encodeURIComponent(token) + '&format=json', { headers: { Accept: 'application/json' } })
        .then(function (res) { return res.json().catch(function () { return {}; }); })
        .then(function (res) {
          if (!res || !res.success || !res.item) { showError(); return; }

          var item = res.item;
          var type = item.type || res.type || 'note';
          var color = safeColor(item.color);

          hide('loading');
          $('stripe').style.background = color;
          $('dot').style.background = color;
          $('type-label').textContent = TEXT[type] || TEXT.note;
          $('title').textContent = item.title || TEXT.untitled;
          document.title = (item.title || TEXT.untitled) + ' • NoteMaster';

          var meta = [];
          if (type === 'event') {
            var start = formatDate(item.start_at || item.date, !!item.start_at);
            if (start) meta.push(start);
            if (item.location) meta.push(item.location);
          } else {
            var date = formatDate(item.updated_at || item.created_at, false);
            if (date) meta.push(date);
          }
          var metaBox = $('meta');
          meta.forEach(function (m) {
            var s = document.createElement('span');
            s.textContent = m;
            metaBox.appendChild(s);
          });

          // Plain text: never interpreted as HTML.
          $('content').textContent = item.content || '';
          show('item');

          var deepLink = res.deepLinkUrl || ('notemaster://s/' + encodeURIComponent(token));
          if (isIos || isAndroid) {
            var openBtn = $('open-app');
            openBtn.href = deepLink;
            openBtn.textContent = TEXT.openApp;
            show('open-app');
            // Try to open the app; if it is not installed the page stays.
            setTimeout(function () { window.location.href = deepLink; }, 300);
          }
          renderStores(res.playStoreUrl || DEFAULT_PLAY, res.appStoreUrl || DEFAULT_APPLE);
        })
        .catch(function () { showError(TEXT.networkMsg); });
    })();
  </script>
</body>
</html>
