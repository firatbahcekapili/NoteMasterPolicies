<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteMaster - Smart Notes, Tasks & Agenda</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #1f2937;
      max-width: 800px;
      margin: 0 auto;
      padding: 48px 20px;
      background-color: #f9fafb;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 48px 32px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 { color: #111827; margin-bottom: 12px; font-size: 28px; }
    p { color: #6b7280; font-size: 16px; margin-bottom: 32px; }
    .links { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #4f46e5;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: #4338ca; }
    .btn-secondary {
      background-color: #f3f4f6;
      color: #374151;
    }
    .btn-secondary:hover { background-color: #e5e7eb; }
  </style>
</head>
<body>
  <div class="card">
    <h1>NoteMaster</h1>
    <p>Smart productivity app unifying your notes, tasks, and calendar events in one place.</p>
    <div class="links">
      <a href="privacy.html" class="btn">Privacy Policy / Gizlilik Politikası</a>
      <a href="terms.html" class="btn btn-secondary">Terms of Service / Kullanım Koşulları</a>
    </div>
  </div>
</body>
</html>
